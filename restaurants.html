<!doctype html>
<html lang="ja">
<head>

<title>富士宮 飲食店検索｜ふじのみや旅ナビ</title>
<style>
:root{--green:#0b7a5c;--green2:#174f40;--ink:#18362e;--line:rgba(255,255,255,.38)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
body{background:#18362e;position:relative}
body::before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-2;
 background:url("./restaurants-bg.png") center center/cover no-repeat;
 transform:translateZ(0);
}
body::after{
 content:"";
 position:fixed;
 inset:0;
 z-index:-1;
 background:linear-gradient(rgba(12,53,42,.10),rgba(12,53,42,.18));
 pointer-events:none;
}
.hero{min-height:380px;color:#fff;padding:38px 18px 72px}
.hero-inner{max-width:1040px;margin:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.09em;font-size:18px}
.logo{width:48px;height:48px;background:rgba(255,255,255,.88);border-radius:14px;display:grid;place-items:center;box-shadow:0 8px 25px #0002}
.logo svg{width:29px;height:29px}
h1{font-size:clamp(32px,8vw,56px);line-height:1.05;margin:56px 0 12px;text-shadow:0 3px 18px #1248}
.lead{max-width:680px;font-weight:700;font-size:17px;line-height:1.8;text-shadow:0 2px 10px #1247}
main{max-width:1100px;margin:-28px auto 80px;padding:0 16px}
.toolbar{
 background:rgba(255,255,255,.62);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
 border:1px solid rgba(255,255,255,.48);border-radius:26px;padding:16px;
 box-shadow:0 14px 32px rgba(16,58,46,.16)
}
.search-wrap{display:flex;gap:10px}
.search{
 flex:1;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.72);
 border-radius:16px;padding:14px 16px;outline:none;font-size:16px
}
.locate{
 border:0;background:var(--green);color:#fff;border-radius:16px;padding:0 16px;font-weight:800;
 text-decoration:none;display:grid;place-items:center;text-align:center;min-height:48px
}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 14px}
.section-head h2{margin:0;font-size:24px;color:#fff;text-shadow:0 2px 12px #0008}
.count{color:#fff;font-size:14px;font-weight:800;text-shadow:0 2px 8px #0008}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{
 position:relative;background:rgba(255,255,255,.11);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
 border:1px solid rgba(255,255,255,.30);border-radius:22px;overflow:hidden;
 box-shadow:0 10px 24px rgba(11,43,36,.14);width:92%;margin:0 auto
}
.card-body{padding:15px;display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.24)}
.badge{
 display:inline-flex;align-self:flex-start;padding:5px 8px;border-radius:999px;
 background:rgba(255,255,255,.54);color:var(--green2);font-weight:800;font-size:11px;
 border:1px solid rgba(255,255,255,.46)
}
.card h3{font-size:18px;margin:0;line-height:1.4}
.addr{font-size:12px;color:#1f342d;line-height:1.55;font-weight:700}
.contact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.contact a{
 color:#0a5f4a;text-decoration:none;background:rgba(255,255,255,.46);padding:5px 8px;
 border-radius:9px;font-size:12px;font-weight:800
}
.search-note{font-size:10px;color:rgba(31,52,45,.66);margin-top:-3px}
.actions{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(62px,.65fr) 40px;gap:8px;margin-top:2px}
.btn{border:0;border-radius:12px;padding:8px 6px;font-weight:800;text-align:center;text-decoration:none;font-size:12px}
.btn.primary{background:rgba(11,122,92,.88);color:#fff}
.btn.secondary{background:rgba(255,255,255,.56);color:#284a40}
.btn.fav{font-size:19px;background:rgba(255,243,217,.66);color:#a46b00}
.empty{
 grid-column:1/-1;text-align:center;padding:45px;background:rgba(255,255,255,.62);
 border-radius:22px;font-weight:800
}
.note{
 margin-top:26px;padding:14px;border-radius:18px;background:rgba(255,248,235,.72);
 backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);font-size:12px;line-height:1.7
}
footer{padding:30px 16px 48px;text-align:center;color:#fff;text-shadow:0 2px 8px #0008;line-height:1.8}
footer a{color:#fff}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){
 .hero{min-height:310px}h1{margin-top:48px}.lead{font-size:15px}
 main{padding:0 12px}.grid{grid-template-columns:1fr;gap:22px}.search-wrap{display:grid}
 .card{width:92%}.locate{padding:12px}.actions{grid-template-columns:minmax(0,1.35fr) minmax(60px,.62fr) 40px}
}

.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 6px}
.pager button{
 border:0;border-radius:14px;padding:11px 18px;font-weight:900;font-size:13px;
 background:rgba(255,255,255,.82);color:#174f40;box-shadow:0 6px 18px rgba(0,0,0,.10)
}
.pager button:disabled{opacity:.38}
.page-info{color:#fff;font-size:12px;font-weight:900;text-shadow:0 2px 8px #0008;min-width:76px;text-align:center}

</style>
</head>

hone":"0544-24-4245"},{"id":"restaurant-049","name":"ミマスヤ2","address":"元城町10-15","phone":"0544-23-5885"},{"id":"restaurant-050","name":"ロッテリア鉄ちゃん","address":"浅間町1-8","phone":"0544-25-6760"},{"id":"restaurant-051","name":"五平茶屋","address":"上井出3776-7","phone":"0544-54-0514"},{"id":"restaurant-052","name":"前島","address":"矢立町195","phone":"0544-27-6500"},{"id":"restaurant-053","name":"喜せらせら","address":"宮町9-17","phone":"0544-57-9684"},{"id":"restaurant-054","name":"喫茶ヴィーナス","address":"ひばりヶ丘287","phone":"0544-27-1144"},{"id":"restaurant-055","name":"土一揆","address":"山本561-5","phone":"0544-23-4040"},{"id":"restaurant-056","name":"大衆食堂 祭","address":"中央町5-1","phone":"0544-66-3711"},{"id":"restaurant-057","name":"大阪屋","address":"元城町12-10","phone":"0544-27-0237"},{"id":"restaurant-058","name":"天神橋","address":"上井出825-6","phone":"0544-54-0520※"},{"id":"restaurant-059","name":"富士宮やきそば め.め","address":"宮原385-9","phone":"090-1783-3665"},{"id":"restaurant-060","name":"富士宮やきそばアンテナショップ","address":"宮町4-23","phone":"0544-22-5341"},{"id":"restaurant-061","name":"富士宮焼きそば＆ビストロ FUJIBOKU","address":"宮町4-22","phone":"0544-57-9115"},{"id":"restaurant-062","name":"居酒屋なべちゃん","address":"淀師705-1 益穂ビル1F","phone":"0544-66-9185"},{"id":"restaurant-063","name":"平石屋","address":"上井出266-7","phone":"0544-54-0068"},{"id":"restaurant-064","name":"月あかり 富士宮店","address":"中央町3-9","phone":"0544-25-5255"},{"id":"restaurant-065","name":"松美","address":"穂波町7-1","phone":"0544-57-9193"},{"id":"restaurant-066","name":"浜新","address":"貴船町1-7","phone":"0544-26-2075"},{"id":"restaurant-067","name":"海友","address":"西町28-9","phone":"0544-27-0207"},{"id":"restaurant-068","name":"清ふじ","address":"北山1046-1","phone":"0544-58-2436"},{"id":"restaurant-069","name":"焼きそばお好み うめづ","address":"外神1273-5","phone":"0544-22-1104"},{"id":"restaurant-070","name":"白扇（ハクセン）","address":"上条438-1（新町横通り）","phone":"0544-58-0171"},{"id":"restaurant-071","name":"笑門","address":"宮町4-3","phone":"0544-25-7577"},{"id":"restaurant-072","name":"花多幸","address":"万野原新田3063-21","phone":"0544-25-2558"},{"id":"restaurant-073","name":"虹屋ミミ","address":"中央町3-9","phone":"0544-24-0791"},{"id":"restaurant-074","name":"豊延","address":"下条1611-1","phone":"090-8954-2235"},{"id":"restaurant-075","name":"農場レストランでいただきます","address":"内野1327-1","phone":"0544-54-0342"},{"id":"restaurant-076","name":"金太郎","address":"小泉1930","phone":"0544-22-6613"},{"id":"restaurant-077","name":"鉄板焼すぎ本","address":"西町16-3","phone":"0544-26-4477"},{"id":"restaurant-078","name":"鉄板焼すぎ本 お宮横丁店","address":"宮町4-23","phone":"0544-24-8272"},{"id":"restaurant-079","name":"鉄板焼ちゃん 駅前店","address":"中央町9-3","phone":"0544-22-3835"},{"id":"restaurant-080","name":"食事・酒処 いちゃり場","address":"三園平7","phone":"0544-66-6220"},{"id":"restaurant-081","name":"駄菓子屋 京ちゃん","address":"城北町234","phone":"0544-27-1208"}];
let favorites=new Set(JSON.parse(localStorage.getItem("fujinomiyaRestaurantFavorites")||"[]"));
const PAGE_SIZE=10;
let currentPage=1;

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fullAddress=r=>`静岡県富士宮市${r.address||""}`;
const destination=r=>`${r.name||""} ${fullAddress(r)}`.trim();
const mapUrl=r=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destination(r))}`;
const routeUrl=r=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination(r))}&travelmode=driving`;
const searchUrl=r=>`https://www.google.com/search?q=${encodeURIComponent(r.name+" 富士宮")}`;
const telHref=phone=>"tel:"+String(phone||"").replace(/\D/g,"");

function filtered(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  if(!q) return RESTAURANTS;
  return RESTAURANTS.filter(r=>
    `${r.name} ${r.address} ${r.phone}`.toLowerCase().includes(q)
  );
}

function render(){
  const data=filtered();
  const totalPages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));
  if(currentPage>totalPages) currentPage=totalPages;
  if(currentPage<1) currentPage=1;

  const start=(currentPage-1)*PAGE_SIZE;
  const pageData=data.slice(start,start+PAGE_SIZE);

  document.getElementById("count").textContent=`${data.length}件`;
  document.getElementById("pageInfo").textContent=data.length ? `${currentPage} / ${totalPages}` : "";
  document.getElementById("prevPage").disabled=currentPage<=1;
  document.getElementById("nextPage").disabled=currentPage>=totalPages || !data.length;

  const grid=document.getElementById("grid");

  if(!data.length){
    grid.innerHTML='<div class="empty">条件に合う飲食店がありません。</div>';
    return;
  }

  grid.innerHTML=pageData.map(r=>{
    const fav=favorites.has(r.id);
    return `<article class="card">
      <div class="card-body">
        <div class="badge">飲食店</div>
        <h3>${esc(r.name)}</h3>
        <div class="addr">📍 ${esc(r.address)}</div>
        <div class="contact">
          <a href="${telHref(r.phone)}">☎ ${esc(r.phone)}</a>
          <a href="${searchUrl(r)}" target="_blank" rel="noopener">🔎 検索する</a>
        </div>
        <div class="search-note">「検索する」は店名でWeb検索します。</div>
        <div class="actions">
          <a class="btn primary" href="${routeUrl(r)}" target="_blank" rel="noopener">📍 現在地からの行き方</a>
          <a class="btn secondary" href="${mapUrl(r)}" target="_blank" rel="noopener">地図</a>
          <button class="btn fav" data-fav="${esc(r.id)}">${fav?"★":"☆"}</button>
        </div>
      </div>
    </article>`;
  }).join("");

  grid.querySelectorAll("[data-fav]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.fav;
      favorites.has(id)?favorites.delete(id):favorites.add(id);
      localStorage.setItem("fujinomiyaRestaurantFavorites",JSON.stringify([...favorites]));
      render();
    };
  });
}
document.getElementById("search").addEventListener("input",()=>{currentPage=1;render()});
document.getElementById("prevPage").onclick=()=>{if(currentPage>1){currentPage--;render();window.scrollTo({top:document.querySelector(".section-head").offsetTop-20,behavior:"smooth"})}};
document.getElementById("nextPage").onclick=()=>{const total=Math.ceil(filtered().length/PAGE_SIZE);if(currentPage<total){currentPage++;render();window.scrollTo({top:document.querySelector(".section-head").offsetTop-20,behavior:"smooth"})}};
render();
</script>
</body>
</html>
