<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244f78">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>富士宮 宿泊施設検索｜ふじのみや旅ナビ</title>
<style>
:root{--blue:#2b6898;--blue2:#234f74;--ink:#173449;--line:rgba(255,255,255,.38)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
html{background:#17344a}
body{
 background:transparent;
 position:relative;
 isolation:isolate;
}
body::before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-2;
 background:url("./accommodations-bg.png") center center/cover no-repeat;
 transform:translateZ(0);
 -webkit-transform:translateZ(0);
 pointer-events:none;
}
body::after{
 content:"";
 position:fixed;
 inset:0;
 z-index:-1;
 background:linear-gradient(rgba(14,43,67,.10),rgba(14,43,67,.20));
 pointer-events:none;
}
.hero{min-height:380px;color:#fff;padding:38px 18px 72px}
.hero-inner{max-width:1040px;margin:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.09em;font-size:18px}
.logo{width:48px;height:48px;background:rgba(255,255,255,.88);border-radius:14px;display:grid;place-items:center;box-shadow:0 8px 25px #0002}
.logo svg{width:29px;height:29px}
h1{font-size:clamp(32px,8vw,56px);line-height:1.05;margin:56px 0 12px;text-shadow:0 3px 18px #1248}
.lead{max-width:720px;font-weight:700;font-size:17px;line-height:1.8;text-shadow:0 2px 10px #1247}
main{max-width:1100px;margin:-28px auto 80px;padding:0 16px}
.toolbar{
 background:rgba(255,255,255,.62);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
 border:1px solid rgba(255,255,255,.48);border-radius:26px;padding:16px;
 box-shadow:0 14px 32px rgba(16,58,80,.16)
}
.search-wrap{display:grid;gap:10px}
.search{
 width:100%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.76);
 border-radius:16px;padding:14px 16px;outline:none;font-size:16px
}
.page-switches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locate{
 border:0;background:#0b7a5c;color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;
 text-decoration:none;display:grid;place-items:center;text-align:center;min-height:48px
}

.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 14px}
.section-head h2{margin:0;font-size:24px;color:#fff;text-shadow:0 2px 12px #0008}
.count{color:#fff;font-size:14px;font-weight:800;text-shadow:0 2px 8px #0008}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{
 position:relative;background:rgba(255,255,255,.12);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
 border:1px solid rgba(255,255,255,.30);border-radius:22px;overflow:hidden;
 box-shadow:0 10px 24px rgba(11,43,60,.15);width:92%;margin:0 auto
}
.card-body{padding:15px;display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.30)}
.badge{
 display:inline-flex;align-self:flex-start;padding:5px 8px;border-radius:999px;
 background:rgba(255,255,255,.58);color:var(--blue2);font-weight:800;font-size:11px;
 border:1px solid rgba(255,255,255,.46)
}
.card h3{font-size:18px;margin:0;line-height:1.4}
.addr{font-size:12px;color:#203c4c;line-height:1.55;font-weight:700}
.contact{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.contact a{
 color:#19577f;text-decoration:none;background:rgba(255,255,255,.52);padding:5px 8px;
 border-radius:9px;font-size:12px;font-weight:800
}
.desc{font-size:13px;line-height:1.7;color:#294858;background:rgba(255,255,255,.22);border-radius:12px;padding:9px 10px}
.actions{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(62px,.65fr) 40px;gap:8px;margin-top:2px}
.btn{border:0;border-radius:12px;padding:8px 6px;font-weight:800;text-align:center;text-decoration:none;font-size:12px}
.btn.primary{background:rgba(43,104,152,.92);color:#fff}
.btn.secondary{background:rgba(255,255,255,.58);color:#284a5e}
.btn.fav{font-size:19px;background:rgba(255,243,217,.68);color:#a46b00}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 6px}
.pager button{
 border:0;border-radius:14px;padding:11px 18px;font-weight:900;font-size:13px;
 background:rgba(255,255,255,.84);color:#234f74;box-shadow:0 6px 18px rgba(0,0,0,.10)
}
.pager button:disabled{opacity:.38}
.page-info{color:#fff;font-size:12px;font-weight:900;text-shadow:0 2px 8px #0008;min-width:76px;text-align:center}
.empty{
 grid-column:1/-1;text-align:center;padding:45px;background:rgba(255,255,255,.62);
 border-radius:22px;font-weight:800
}
.note{
 margin-top:26px;padding:14px;border-radius:18px;background:rgba(255,248,235,.74);
 backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);font-size:12px;line-height:1.7
}
footer{padding:30px 16px 48px;text-align:center;color:#fff;text-shadow:0 2px 8px #0008;line-height:1.8}
footer a{color:#fff}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){
 .hero{min-height:310px}h1{margin-top:48px}.lead{font-size:15px}
 main{padding:0 12px}.grid{grid-template-columns:1fr;gap:22px}.page-switches{grid-template-columns:1fr}
 .card{width:92%}.actions{grid-template-columns:minmax(0,1.35fr) minmax(60px,.62fr) 40px}
}

.map-toggle{
 width:100%;border:0;border-radius:16px;padding:13px 16px;margin-bottom:10px;
 background:rgba(20,103,76,.94);color:#fff;font-weight:900;font-size:15px;
 box-shadow:0 6px 16px rgba(15,69,53,.16)
}
.map-toggle.open{background:rgba(48,80,112,.94)}
.map-panel{
 margin:12px 0 18px;padding:10px;border-radius:22px;
 background:rgba(255,255,255,.67);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,.55);box-shadow:0 12px 28px rgba(0,0,0,.12)
}
.map-stage{position:relative;width:100%;height:390px;border-radius:16px;overflow:hidden;background:#eef4ef}
#facilityMap{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;border-radius:16px;overflow:hidden;background:#dfece5}
#facilityMap .leaflet-container{width:100%!important;height:100%!important}
#facilityMap .leaflet-tile-container img,#facilityMap .leaflet-tile{
 max-width:none!important;max-height:none!important;width:256px!important;height:256px!important
}
#facilityMap .leaflet-marker-icon{max-width:none!important;max-height:none!important}
.map-current-btn{
 position:absolute;top:10px;right:10px;z-index:1000;border:2px solid rgba(255,255,255,.95);
 border-radius:999px;background:rgba(255,255,255,.94);color:#1769aa;font-weight:900;
 font-size:12px;padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.20)
}
.map-current-btn:active{transform:scale(.98)}
.map-status{font-size:11px;line-height:1.45;color:#37574c;padding:7px 4px 1px;font-weight:700}
.cute-pin{position:relative!important;width:40px!important;height:49px!important;display:block!important;filter:drop-shadow(0 4px 5px rgba(0,0,0,.28))}
.cute-pin .pin-circle{
 width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
 border:3px solid #fff;position:relative;z-index:2
}
.cute-pin .pin-tail{
 position:absolute;left:13px;top:29px;width:14px;height:14px;
 transform:rotate(45deg);border-right:3px solid #fff;border-bottom:3px solid #fff;z-index:1
}
.cute-pin.facility .pin-circle,.cute-pin.facility .pin-tail{background:#15945f}
.cute-pin.current .pin-circle,.cute-pin.current .pin-tail{background:#2186df}
.cute-pin svg{width:24px;height:24px;display:block}
.map-popup-name{font-weight:900;font-size:13px;margin-bottom:4px}
.map-popup-address{font-size:11px;line-height:1.4;margin-bottom:6px}
.map-popup-link{display:inline-block;font-size:11px;font-weight:800;text-decoration:none;color:#0b7a5c}
@media(max-width:580px){.map-stage{height:380px}}


/* Leaflet core CSS — embedded locally for reliable iPhone rendering */
.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane>svg,
.leaflet-pane>canvas,
.leaflet-zoom-box{
 position:absolute;
 left:0;
 top:0;
}
.leaflet-container{
 overflow:hidden;
 -webkit-tap-highlight-color:transparent;
 background:#ddd;
 outline-offset:1px;
}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow{
 -webkit-user-select:none;
 -moz-user-select:none;
 user-select:none;
 -webkit-user-drag:none;
}
.leaflet-marker-icon,
.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{
 max-width:none!important;
 max-height:none!important;
}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container img.leaflet-image-layer{
 max-width:none!important;
 max-height:none!important;
 padding:0!important;
 margin:0!important;
 border:0!important;
}
.leaflet-container .leaflet-tile-pane img,
.leaflet-container .leaflet-tile{
 max-width:none!important;
 max-height:none!important;
 width:256px!important;
 height:256px!important;
 padding:0!important;
 margin:0!important;
 border:0!important;
 object-fit:fill!important;
}
.leaflet-tile{visibility:visible!important;opacity:1!important}
.leaflet-tile-loaded{visibility:visible!important;opacity:1!important}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-box{
 width:0;
 height:0;
 box-sizing:border-box;
 z-index:800;
}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{
 position:relative;
 z-index:800;
 pointer-events:auto;
 float:left;
 clear:both;
}
.leaflet-top,
.leaflet-bottom{
 position:absolute;
 z-index:1000;
 pointer-events:none;
}
.leaflet-top{top:0}
.leaflet-right{right:0}
.leaflet-bottom{bottom:0}
.leaflet-left{left:0}
.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-control-zoom{
 border:2px solid rgba(0,0,0,.18);
 border-radius:6px;
 overflow:hidden;
 background:#fff;
 box-shadow:0 1px 5px rgba(0,0,0,.22);
}
.leaflet-control-zoom a{
 display:block;
 width:32px;
 height:32px;
 line-height:32px;
 text-align:center;
 text-decoration:none;
 color:#222;
 background:#fff;
 font:bold 18px/32px Arial,Helvetica,sans-serif;
 border-bottom:1px solid #ddd;
}
.leaflet-control-zoom a:last-child{border-bottom:0}
.leaflet-control-zoom a.leaflet-disabled{
 color:#bbb;
 background:#f4f4f4;
 cursor:default;
}
.leaflet-control-attribution{
 padding:2px 5px;
 color:#333;
 background:rgba(255,255,255,.80);
 font-size:10px;
 line-height:1.3;
}
.leaflet-control-attribution a{color:#1769aa;text-decoration:none}
.leaflet-popup{
 position:absolute;
 text-align:center;
 margin-bottom:20px;
}
.leaflet-popup-content-wrapper{
 padding:1px;
 text-align:left;
 border-radius:12px;
 background:#fff;
 color:#263d36;
 box-shadow:0 3px 14px rgba(0,0,0,.25);
}
.leaflet-popup-content{
 margin:12px 14px;
 line-height:1.4;
 min-width:120px;
}
.leaflet-popup-tip-container{
 width:40px;
 height:20px;
 position:absolute;
 left:50%;
 margin-left:-20px;
 overflow:hidden;
 pointer-events:none;
}
.leaflet-popup-tip{
 width:17px;
 height:17px;
 padding:1px;
 margin:-10px auto 0;
 transform:rotate(45deg);
 background:#fff;
 box-shadow:3px 3px 6px rgba(0,0,0,.18);
}
.leaflet-popup-close-button{
 position:absolute;
 top:0;
 right:0;
 border:0;
 background:transparent;
 color:#777;
 font:20px/24px Arial,Helvetica,sans-serif;
 width:28px;
 height:28px;
 text-decoration:none;
 z-index:10;
}
.leaflet-tooltip{
 position:absolute;
 padding:6px;
 background:#fff;
 border:1px solid #fff;
 border-radius:4px;
 color:#222;
 white-space:nowrap;
 box-shadow:0 1px 3px rgba(0,0,0,.25);
 pointer-events:none;
}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{will-change:transform}


/* Swipe page navigation */
.toolbar{
 position:relative;
 touch-action:pan-y;
}
.swipe-hint{
 margin-top:9px;
 text-align:center;
 font-size:10.5px;
 line-height:1.45;
 font-weight:700;
 color:rgba(31,52,45,.68);
 user-select:none;
 -webkit-user-select:none;
}
.swipe-dots{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:5px;
 margin-top:5px;
}
.swipe-dot{
 width:6px;
 height:6px;
 border-radius:50%;
 background:rgba(31,52,45,.24);
}
.swipe-dot.active{
 width:16px;
 border-radius:999px;
 background:rgba(11,122,92,.72);
}
.toolbar.swiping-left{transform:translateX(-8px)}
.toolbar.swiping-right{transform:translateX(8px)}
.toolbar{
 transition:transform .12s ease;
}


/* Map gesture reliability */
#facilityMap{
 -webkit-user-select:none;
 user-select:none;
 -webkit-touch-callout:none;
}
.map-stage{
 overscroll-behavior:contain;
}
#facilityMap .leaflet-control-zoom a{
 touch-action:manipulation;
}


/* Stable built-in cluster + facility-photo pin */
.map-cluster-pin{
 width:52px;height:52px;border-radius:50%;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#38b97f,#0b7652);
 border:4px solid #fff;
 box-shadow:0 6px 16px rgba(0,0,0,.25);
 color:#fff;font-size:17px;font-weight:900;
}
.map-cluster-pin span{line-height:1;min-width:24px;text-align:center}
.cute-pin.facility.has-photo .pin-circle{background:#fff;overflow:hidden}
.cute-pin.facility.has-photo .pin-tail{background:#15945f}
.cute-pin .pin-photo{width:100%;height:100%;object-fit:cover;display:block}
.cute-pin .pin-fallback{width:100%;height:100%;display:grid;place-items:center;background:#15945f}

</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 64 64"><path d="M7 48 31 11l26 37H7Z" fill="#4ba37e"/><path d="m31 11 9 13-8 8-7-6-7 8Z" fill="#fff"/><circle cx="48" cy="13" r="7" fill="#f2be4f"/></svg></div>
    <span>FUJINOMIYA STAY GUIDE</span>
  </div>
  <h1>富士宮の宿泊施設</h1>
  <div class="lead">富士宮市内の旅館・ホテル・民宿・貸別荘・キャンプ場などから、旅の目的に合う宿泊施設を探せます。</div>
</div></header>

<main>
  <section class="toolbar">
    <button id="mapToggleBtn" class="map-toggle" type="button">🗺️ 地図で見る</button>
    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="施設名・住所・電話番号・説明文で検索">
      
    </div>
  
    <div class="swipe-hint">
      ← この枠を左右にスライドすると「観光スポット・飲食店・宿泊施設」を切り替えられます →
      <div class="swipe-dots"><span class="swipe-dot"></span><span class="swipe-dot"></span><span class="swipe-dot active"></span></div>
    </div>
</section>

  <div class="section-head">
    <h2>宿泊施設</h2>
    <div id="count" class="count"></div>
  </div>
  <div id="mapPanel" class="map-panel" hidden>
    <div class="map-stage">
      <div id="facilityMap"></div>
      <button id="mapCurrentBtn" class="map-current-btn" type="button">◎ 現在地</button>
    </div>
    <div id="mapStatus" class="map-status">このページの該当施設をすべて地図に表示します。</div>
  </div>

  <section id="grid" class="grid"></section>

  <div class="pager">
    <button id="prevPage" type="button">← 前の10件</button>
    <div id="pageInfo" class="page-info"></div>
    <button id="nextPage" type="button">次の10件 →</button>
  </div>

  <div class="note">
    営業日・料金・予約条件・空室状況などは変更される場合があります。宿泊前に各施設へご確認ください。
  </div>
</main>

<footer>
  <strong>ふじのみや旅ナビ｜宿泊施設検索</strong><br>
  地図・経路ボタンはGoogleマップへ移動します。
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app-config.js"></script>

70-1","phone":"0544-58-3755","description":"白糸の滝、田貫湖、富士登山などへの移動に便利な北部の民宿旅館。富士山を望める客室を複数備え、観光客のほかグループ・合宿利用にも対応する、家庭的な滞在拠点。"},{"id":"accommodation-021","name":"芝川苑","address":"静岡県富士宮市内房919-1","phone":"0544-65-0542","description":"芝川・内房地区の緑豊かな環境にある和風の宿。日本庭園を眺めながら落ち着いて過ごせ、四季の素材を生かした料理を提供する。市街地の喧騒を離れた保養や家族旅行、会食を伴う宿泊に向く。"},{"id":"accommodation-022","name":"MT. FUJI SATOYAMA VACATION","address":"静岡県富士宮市狩宿8-2","phone":"0544-66-5722","description":"「和」と里山文化をテーマにした少人数制のグランピング施設。SDGsを意識した施設づくりを行い、地域住民や自然との出会いを組み込むエコツアーも実施する。富士山を眺めながら体験型の滞在をしたい人向け。"},{"id":"accommodation-023","name":"朝霧ジャンボリーオートキャンプ場","address":"静岡県富士宮市猪之頭1162-3","phone":"0544-52-2066","description":"朝霧高原の広大な芝地に車で乗り入れられるオートフリーサイト。富士山の眺望、地下約180メートルから汲み上げる天然水、電源付き・プレミアムサイト、充実したレンタルが特徴で、初心者から長期滞在まで対応する。"},{"id":"accommodation-024","name":"田貫湖キャンプ場（南テントサイト）","address":"静岡県富士宮市佐折634-1","phone":"090-4234-8039／0544-52-0155","description":"田貫湖畔の全面芝生テントサイト。炊飯棟、トイレ、温水シャワーを備え、周遊散策・自転車・ボート・釣りも楽しめる。宿泊は予約制で、南側管理棟「瓔珞の家」が受付・売店・軽食営業を担う。"},{"id":"accommodation-025","name":"天子の森オートキャンプ場","address":"静岡県富士宮市佐折631","phone":"0544-54-1543","description":"天子ヶ岳の自然と川に近いオートキャンプ場。テント泊、車を横付けする区画、川遊びを中心に、静かな森林環境で過ごせる。例年4月から11月末ごろまでの季節営業で、営業日と予約状況の事前確認が必要。"},{"id":"accommodation-026","name":"ACN西富士オートキャンプ場","address":"静岡県富士宮市内野1687","phone":"0544-54-1947","description":"朝霧高原南端、標高約630メートルの野鳥の森にあるキャンプ場。東に富士山、西に天子ヶ岳を望み、場内の湧水や芝川への散策を楽しめる。静かな林間環境と県道からのアクセスの良さを両立している。"},{"id":"accommodation-027","name":"富士オートキャンプ場 ふもと村","address":"静岡県富士宮市麓174-1","phone":"0544-52-1220","description":"富士山麓の林間に約62区画を設けるオートキャンプ場。木々に囲まれた環境で、車をサイト近くに置いてキャンプを楽しめる。例年4月から11月上旬ごろまでの季節営業で、夏の避暑や家族キャンプに向く。"},{"id":"accommodation-028","name":"ペンギン村オートキャンプ場","address":"静岡県富士宮市猪之頭2351","phone":"090-7680-3286","description":"猪之頭の湧水と自然に恵まれた小規模なオートキャンプ場。場内の水辺と静かな林間環境を生かし、落ち着いてテント泊を楽しみたい家族や少人数グループに向く。予約・営業状況は電話での確認が確実。"},{"id":"accommodation-029","name":"ふもとっぱら","address":"静岡県富士宮市麓156","phone":"0544-52-2112","description":"富士山を正面に望む広大な草原で知られる地域運営のキャンプ・宿泊施設。フリーサイトでのテント泊やデイキャンプに加え、森のコテー    lat>=FUJINOMIYA_BOUNDS[0][0]&&lat<=FUJINOMIYA_BOUNDS[1][0]&&
   lng>=FUJINOMIYA_BOUNDS[0][1]&&lng<=FUJINOMIYA_BOUNDS[1][1];
}

function forceMapResize(){
 if(!appMap) return;
 const run=()=>{
   try{appMap.invalidateSize({pan:false,animate:false});}catch(e){}
 };
 requestAnimationFrame(run);
 setTimeout(run,120);
}

function ensureFacilityMap(){
 if(appMap) return appMap;
 if(!window.L){
   const s=document.getElementById("mapStatus");
   if(s)s.textContent="地図を読み込めませんでした。通信状態を確認して、もう一度『地図で見る』を押してください。";
   return null;
 }
 const maxBounds=L.latLngBounds(FUJINOMIYA_BOUNDS[0],FUJINOMIYA_BOUNDS[1]);
 appMap=L.map("facilityMap",{
   zoomControl:true,
   minZoom:9,
   maxZoom:19,
   maxBounds:maxBounds,
   maxBoundsViscosity:0.15,
   worldCopyJump:false,
   dragging:true,
   touchZoom:true,
   doubleClickZoom:true,
   scrollWheelZoom:true,
   boxZoom:false,
   keyboard:false,
   inertia:true,
   inertiaDeceleration:3000,
   inertiaMaxSpeed:1800,
   easeLinearity:0.25,
   zoomSnap:0.5,
   zoomDelta:0.5
 }).setView(FUJINOMIYA_CENTER,11);

 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
   minZoom:9,maxZoom:19,tileSize:256,noWrap:true,keepBuffer:4,
   updateWhenIdle:true,updateWhenZooming:false,crossOrigin:true,
   attribution:"&copy; OpenStreetMap contributors"
 }).addTo(appMap);

 mapFacilityLayer=L.layerGroup().addTo(appMap);
 const rerender=()=>{
   if(mapRenderTimer)clearTimeout(mapRenderTimer);
   mapRenderTimer=setTimeout(()=>renderClusteredMarkers(),45);
 };
 appMap.on("zoomend moveend",rerender);
 forceMapResize();
 return appMap;
}
function renderIndividualMarkers(points){
 if(!appMap||!mapFacilityLayer||!window.L)return;

 // At high zoom, show every facility as a separate pin.
 // When multiple facilities have the same/almost-same coordinates,
 // spread them slightly in a circle so no pin is hidden underneath another.
 const groups=[];
 const thresholdPx=12;

 for(const entry of points){
   const p=appMap.latLngToLayerPoint(L.latLng(entry.c[0],entry.c[1]));
   let group=null;
   for(const g of groups){
     const dx=p.x-g.x,dy=p.y-g.y;
     if(Math.sqrt(dx*dx+dy*dy)<=thresholdPx){group=g;break;}
   }
   if(group){
     group.items.push(entry);
     group.x=(group.x*(group.items.length-1)+p.x)/group.items.length;
     group.y=(group.y*(group.items.length-1)+p.y)/group.items.length;
   }else{
     groups.push({items:[entry],x:p.x,y:p.y});
   }
 }

 for(const g of groups){
   if(g.items.length===1){
     const e=g.items[0];
     L.marker(e.c,{icon:mapFacilityIcon(e.item),zIndexOffset:520})
       .addTo(mapFacilityLayer)
       .bindPopup(popupHtml(e.item));
     continue;
   }

   const count=g.items.length;
   const radius=Math.min(44,26+count*2);

   g.items.forEach((e,i)=>{
     const angle=(Math.PI*2*i/count)-Math.PI/2;
     const px=L.point(
       g.x+Math.cos(angle)*radius,
       g.y+Math.sin(angle)*radius
     );
     const shownLatLng=appMap.layerPointToLatLng(px);

     L.marker(shownLatLng,{
       icon:mapFacilityIcon(e.item),
       zIndexOffset:540+i
     })
       .addTo(mapFacilityLayer)
       .bindPopup(popupHtml(e.item));
   });
 }
}

function renderClusteredMarkers(){
 if(!appMap||!mapFacilityLayer||!window.L)return;
 mapFacilityLayer.clearLayers();
 const points=(MAP_MARKER_POINTS||[]).filter(p=>p&&inMapBounds(p.c));
 if(!points.length)return;

 const zoom=appMap.getZoom();

 // From zoom 17 onward, never keep a numbered cluster.
 // Every facility becomes an individual pin.
 if(zoom>=17){
   renderIndividualMarkers(points);
   return;
 }

 const radius=zoom>=16?22:zoom>=14?38:zoom>=12?50:62;
 const clusters=[];

 for(const entry of points){
   const px=appMap.project(L.latLng(entry.c[0],entry.c[1]),zoom);
   let best=null,bestDist=Infinity;
   for(const cl of clusters){
     const dx=px.x-cl.x,dy=px.y-cl.y;
     const d=Math.sqrt(dx*dx+dy*dy);
     if(d<=radius&&d<bestDist){best=cl;bestDist=d;}
   }
   if(best){
     best.items.push(entry);
     best.x=(best.x*(best.items.length-1)+px.x)/best.items.length;
     best.y=(best.y*(best.items.length-1)+px.y)/best.items.length;
   }else{
     clusters.push({items:[entry],x:px.x,y:px.y});
   }
 }

 for(const cl of clusters){
   if(cl.items.length===1){
     const e=cl.items[0];
     L.marker(e.c,{icon:mapFacilityIcon(e.item),zIndexOffset:500})
      .addTo(mapFacilityLayer).bindPopup(popupHtml(e.item));
     continue;
   }

   let lat=0,lng=0;
   for(const e of cl.items){lat+=e.c[0];lng+=e.c[1];}
   const center=[lat/cl.items.length,lng/cl.items.length];

   const marker=L.marker(center,{
     icon:mapClusterIcon(cl.items.length),
     zIndexOffset:450
   }).addTo(mapFacilityLayer);

   marker.on("click",()=>{
     const childBounds=L.latLngBounds(cl.items.map(e=>e.c));

     // If facilities share almost the same coordinates, fitBounds may not zoom enough.
     // Force zoom 18 so the numbered cluster is guaranteed to split.
     if(childBounds.isValid()){
       const sw=childBounds.getSouthWest();
       const ne=childBounds.getNorthEast();
       const almostSame=Math.abs(sw.lat-ne.lat)<0.00003 &&
                        Math.abs(sw.lng-ne.lng)<0.00003;

       if(almostSame){
         appMap.setView(center,18,{animate:true});
       }else{
         appMap.fitBounds(childBounds,{
           padding:[55,55],
           maxZoom:18
         });
         if(appMap.getZoom()<17){
           setTimeout(()=>appMap.setZoom(17,{animate:true}),180);
         }
       }
     }else{
       appMap.setView(center,18,{animate:true});
     }
   });
 }
}
function mapAddress(item){
 const a=String(item.address||"").trim();
 if(!a) return "";
 if(a.startsWith("静岡県")) return a;
 if(a.startsWith("富士宮市")) return "静岡県"+a;
 return "静岡県富士宮市"+a;
}
function mapCache(){
 try{return JSON.parse(localStorage.getItem("fujinomiyaMapGeoCacheV3")||"{}")}catch(e){return {}}
}
function saveMapCache(c){
 try{localStorage.setItem("fujinomiyaMapGeoCacheV3",JSON.stringify(c))}catch(e){}
}
function validMapCoord(lat,lng){
 lat=Number(lat);lng=Number(lng);
 return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180;
}
async function coordsForMap(item){
 if(validMapCoord(item.lat,item.lng)){
   return [Number(item.lat),Number(item.lng)];
 }
 return null;
}

function popupHtml(item){
 const name=esc(item.name||"");
 const address=esc(item.address||"");
 const q=encodeURIComponent(`${item.name||""} ${mapAddress(item)}`.trim());
 return `<div class="map-popup-name">${name}</div><div class="map-popup-address">${address}</div><a class="map-popup-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Googleマップで開く</a>`;
}
function fitFacilityMap(bounds){
 if(!appMap) return;
 const all=[...bounds].filter(c=>inMapBounds(c));
 if(mapCurrentLatLng && inMapBounds(mapCurrentLatLng)) all.push(mapCurrentLatLng);

 if(all.length===1){
   appMap.setView(all[0],15);
 }else if(all.length>1){
   appMap.fitBounds(all,{padding:[36,36],maxZoom:16});
 }else{
   appMap.setView(FUJINOMIYA_CENTER,11);
 }
 
 forceMapResize();
 setTimeout(()=>{
   try{
     mapFacilityLayer.eachLayer(layer=>{
       if(layer&&typeof layer.setZIndexOffset==="function") layer.setZIndexOffset(500);
     });
   }catch(e){}
 },120);
}
async function refreshFacilityMap(items){
 if(!mapVisible) return;
 const run=++mapRunId;
 const map=ensureFacilityMap();
 if(!map) return;
 mapFacilityLayer.clearLayers();
 MAP_MARKER_POINTS=[];

 const list=(items||[]);
 const bounds=[];
 const status=document.getElementById("mapStatus");
 if(status)status.textContent=`施設位置を確認中… 0 / ${list.length}`;
 let done=0,plotted=0,nextIndex=0;
 const workerCount=Math.min(6,Math.max(1,list.length));

 async function worker(){
   while(true){
     const i=nextIndex++;
     if(i>=list.length||run!==mapRunId)return;
     const item=list[i];
     const c=await coordsForMap(item);
     if(run!==mapRunId)return;
     done++;
     if(c&&inMapBounds(c)){
       bounds.push(c);plotted++;
       MAP_MARKER_POINTS.push({item,c});
     }
     if(status&&(done===list.length||done%25===0)){
       status.textContent=`施設位置を確認中… ${done} / ${list.length}（施設 ${plotted}件）`;
     }
   }
 }
 await Promise.all(Array.from({length:workerCount},()=>worker()));
 if(run!==mapRunId)return;
 renderClusteredMarkers();
 fitFacilityMap(bounds);
 if(status)status.textContent=`このページの該当施設 ${list.length}件中、${plotted}件を地図に表示しています。近い施設は数字でまとめています。拡大すると単体ピンに分かれます。`;
 forceMapResize();
}
function locateCurrentOnMap({move=true}={}){
 if(!navigator.geolocation||!mapVisible) return;
 const btn=document.getElementById("mapCurrentBtn");
 if(btn){btn.disabled=true;btn.textContent="取得中…";}
 navigator.geolocation.getCurrentPosition(pos=>{
   if(!mapVisible) return;
   const c=[pos.coords.latitude,pos.coords.longitude];
   mapCurrentLatLng=c;
   const map=ensureFacilityMap();

   if(mapCurrentMarker) mapCurrentMarker.setLatLng(c);
   else mapCurrentMarker=L.marker(c,{icon:mapCurrentIcon(),zIndexOffset:1000})
      .addTo(map).bindPopup("<strong>現在地</strong>");

   if(move){
     if(inMapBounds(c)){
       map.setView(c,15,{animate:true});
       setTimeout(()=>mapCurrentMarker&&mapCurrentMarker.openPopup(),250);
     }else{
       const s=document.getElementById("mapStatus");
       if(s) s.textContent="現在地は富士宮市周辺の地図表示範囲外です。";
       
     }
   }

   if(btn){btn.disabled=false;btn.textContent="◎ 現在地";}
   forceMapResize();
 },()=>{
   const s=document.getElementById("mapStatus");
   if(s) s.textContent="現在地を表示するには、このサイトの位置情報を許可してください。";
   if(btn){btn.disabled=false;btn.textContent="◎ 現在地";}
 },{enableHighAccuracy:true,timeout:12000,maximumAge:15000});
}
document.getElementById("mapToggleBtn").onclick=()=>{
 mapVisible=!mapVisible;
 const panel=document.getElementById("mapPanel");
 const btn=document.getElementById("mapToggleBtn");
 panel.hidden=!mapVisible;
 btn.classList.toggle("open",mapVisible);
 btn.textContent=mapVisible?"✕ 地図を閉じる":"🗺️ 地図で見る";

 if(mapVisible){
   requestAnimationFrame(()=>{
     ensureFacilityMap();
     forceMapResize();
     refreshFacilityMap(CURRENT_MAP_ITEMS);
     locateCurrentOnMap({move:false});
   });
 }else{
   mapRunId++;
 }
};



document.getElementById("mapCurrentBtn").onclick=()=>{
 if(!mapVisible) return;
 locateCurrentOnMap({move:true});
};

const destination=a=>`${a.name||""} ${a.address||""}`.trim();
const mapUrl=a=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destination(a))}`;
const routeUrl=a=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination(a))}&travelmode=driving`;
const searchUrl=a=>`https://www.google.com/search?q=${encodeURIComponent(a.name+" 富士宮")}`;
const phoneNumbers=phone=>String(phone||"").match(/0\d{1,4}-\d{1,4}-\d{3,4}/g)||[];

function filtered(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 if(!q) return ACCOMMODATIONS;
 return ACCOMMODATIONS.filter(a=>
   `${a.name} ${a.address} ${a.phone} ${a.description}`.toLowerCase().includes(q)
 );
}

function phoneHtml(phone){
 const nums=phoneNumbers(phone);
 if(!nums.length) return `<span>${esc(phone||"電話番号情報なし")}</span>`;
 return nums.map(n=>`<a href="tel:${n.replace(/\D/g,"")}">☎ ${esc(n)}</a>`).join("");
}

function render(){
 const data=filtered();
 const totalPages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));
 if(currentPage>totalPages) currentPage=totalPages;
 if(currentPage<1) currentPage=1;

 const start=(currentPage-1)*PAGE_SIZE;
 const pageData=data.slice(start,start+PAGE_SIZE);
 CURRENT_MAP_ITEMS=data;
 if(mapVisible) refreshFacilityMap(CURRENT_MAP_ITEMS);

 document.getElementById("count").textContent=`${data.length}件`;
 document.getElementById("pageInfo").textContent=data.length?`${currentPage} / ${totalPages}`:"";
 document.getElementById("prevPage").disabled=currentPage<=1;
 document.getElementById("nextPage").disabled=currentPage>=totalPages||!data.length;

 const grid=document.getElementById("grid");
 if(!data.length){
   CURRENT_MAP_ITEMS=[];
   if(mapVisible) refreshFacilityMap([]);
   grid.innerHTML='<div class="empty">条件に合う宿泊施設がありません。</div>';
   return;
 }

 grid.innerHTML=pageData.map(a=>{
   const fav=favorites.has(a.id);
   return `<article class="card">
     <div class="card-body">
       <div class="badge">宿泊施設</div>
       <h3>${esc(a.name)}</h3>
       <div class="addr">📍 ${esc(a.address)}</div>
       <div class="contact">
         ${phoneHtml(a.phone)}
         <a href="${searchUrl(a)}" target="_blank" rel="noopener">🔎 検索する</a>
       </div>
       <div class="desc">${esc(a.description)}</div>
       <div class="actions">
         <a class="btn primary" href="${routeUrl(a)}" target="_blank" rel="noopener">📍 現在地からの行き方</a>
         <a class="btn secondary" href="${mapUrl(a)}" target="_blank" rel="noopener">地図</a>
         <button class="btn fav" data-fav="${esc(a.id)}">${fav?"★":"☆"}</button>
       </div>
     </div>
   </article>`;
 }).join("");

 grid.querySelectorAll("[data-fav]").forEach(btn=>{
   btn.onclick=()=>{
     const id=btn.dataset.fav;
     favorites.has(id)?favorites.delete(id):favorites.add(id);
     localStorage.setItem("fujinomiyaAccommodationFavorites",JSON.stringify([...favorites]));
     render();
   };
 });
}

document.getElementById("search").addEventListener("input",()=>{currentPage=1;render()});
document.getElementById("prevPage").onclick=()=>{if(currentPage>1){currentPage--;render();window.scrollTo({top:document.querySelector(".section-head").offsetTop-20,behavior:"smooth"})}};
document.getElementById("nextPage").onclick=()=>{const total=Math.ceil(filtered().length/PAGE_SIZE);if(currentPage<total){currentPage++;render();window.scrollTo({top:document.querySelector(".section-head").offsetTop-20,behavior:"smooth"})}};

async function loadAccommodations(){
  try{
    if(SpotStore.cloudConfigured() && await SpotStore.hasSeededType("accommodation")){
      ACCOMMODATIONS=await SpotStore.list({placeType:"accommodation"});
    }
  }catch(e){
    ACCOMMODATIONS=[...FALLBACK_ACCOMMODATIONS];
  }
  render();
}
loadAccommodations();


const SWIPE_NEXT_PAGE="./index.html";
const SWIPE_PREV_PAGE="./restaurants.html";
let toolbarTouchStartX=0;
let toolbarTouchStartY=0;
let toolbarTouchStartAt=0;
let toolbarSwipeLocked=false;
const swipeToolbar=document.querySelector(".toolbar");

function swipeTargetIsInteractive(target){
  return !!target.closest("input,textarea,select,button,a,[contenteditable='true'],#facilityMap,.leaflet-container");
}

function resetToolbarSwipe(){
  if(!swipeToolbar)return;
  swipeToolbar.classList.remove("swiping-left","swiping-right");
  toolbarSwipeLocked=false;
}

if(swipeToolbar){
  swipeToolbar.addEventListener("touchstart",e=>{
    if(!e.touches||e.touches.length!==1||swipeTargetIsInteractive(e.target)){
      toolbarSwipeLocked=true;
      return;
    }
    toolbarSwipeLocked=false;
    toolbarTouchStartX=e.touches[0].clientX;
    toolbarTouchStartY=e.touches[0].clientY;
    toolbarTouchStartAt=Date.now();
  },{passive:true});

  swipeToolbar.addEventListener("touchmove",e=>{
    if(toolbarSwipeLocked||!e.touches||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-toolbarTouchStartX;
    const dy=e.touches[0].clientY-toolbarTouchStartY;
    if(Math.abs(dx)>18 && Math.abs(dx)>Math.abs(dy)*1.2){
      swipeToolbar.classList.toggle("swiping-left",dx<0);
      swipeToolbar.classList.toggle("swiping-right",dx>0);
    }
  },{passive:true});

  swipeToolbar.addEventListener("touchend",e=>{
    if(toolbarSwipeLocked){resetToolbarSwipe();return;}
    const touch=e.changedTouches?.[0];
    if(!touch){resetToolbarSwipe();return;}
    const dx=touch.clientX-toolbarTouchStartX;
    const dy=touch.clientY-toolbarTouchStartY;
    const elapsed=Date.now()-toolbarTouchStartAt;

    const horizontal=Math.abs(dx)>=65 && Math.abs(dx)>Math.abs(dy)*1.25;
    const timely=elapsed<1100;

    resetToolbarSwipe();

    if(horizontal&&timely){
      location.href=dx<0?SWIPE_NEXT_PAGE:SWIPE_PREV_PAGE;
    }
  },{passive:true});

  swipeToolbar.addEventListener("touchcancel",resetToolbarSwipe,{passive:true});
}

</script>
