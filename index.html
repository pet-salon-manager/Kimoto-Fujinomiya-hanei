<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>ふじのみや旅ナビ</title>
<style>
:root{--green:#0b7a5c;--green2:#0d5f4b;--ink:#15332b;--line:#dfe9e4;--radius:22px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);min-height:100vh;position:relative;background:#173d33}
body::before{content:"";position:fixed;z-index:-2;inset:0;background:url("./fujinomiya-bg.jpg") center center/cover no-repeat;transform:translateZ(0)}
body::after{content:"";position:fixed;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(5,38,50,.10),rgba(10,46,36,.22) 52%,rgba(6,38,30,.34))}
button,input{font:inherit}
.hero{min-height:330px;color:#fff;padding:24px 18px 34px;background:linear-gradient(180deg,rgba(0,32,46,.03),rgba(0,28,35,.16));border-bottom:1px solid rgba(255,255,255,.22)}
.hero-inner{max-width:980px;margin:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.04em}
.logo{width:42px;height:42px;background:rgba(255,255,255,.88);border-radius:14px;display:grid;place-items:center;box-shadow:0 8px 25px #0002}
.logo svg{width:29px;height:29px}
h1{font-size:clamp(32px,8vw,56px);line-height:1.05;margin:56px 0 12px;text-shadow:0 3px 18px #1248}
.lead{max-width:650px;font-weight:700;font-size:17px;line-height:1.8;text-shadow:0 2px 10px #1247}
main{max-width:1100px;margin:-28px auto 80px;padding:0 16px}
.toolbar{background:rgba(255,255,255,.62);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(255,255,255,.48);border-radius:26px;padding:16px;box-shadow:0 14px 32px rgba(16,58,46,.16)}
.search-wrap{display:flex;gap:10px}
.search{flex:1;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.72);border-radius:16px;padding:14px 16px;outline:none}
.locate{border:0;background:var(--green);color:#fff;border-radius:16px;padding:0 16px;font-weight:800}
.chips{display:flex;gap:8px;overflow:auto;padding:14px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.58);border-radius:999px;padding:9px 13px;font-weight:800;color:#3f5b52}
.chip.active{background:rgba(11,122,92,.9);color:#fff;border-color:transparent}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 14px}
.section-head h2{margin:0;font-size:24px;color:#fff;text-shadow:0 2px 12px #0008}
.count{color:#fff;font-size:14px;font-weight:800;text-shadow:0 2px 8px #0008}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{position:relative;background:rgba(255,255,255,.045);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.28);border-radius:22px;overflow:hidden;box-shadow:0 10px 24px rgba(11,43,36,.14);width:92%;margin:0 auto}
.card-body{padding:14px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.18)}
.badge{display:inline-flex;align-self:flex-start;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.42);color:var(--green2);font-weight:800;font-size:11px;border:1px solid rgba(255,255,255,.42)}
.card h3{font-size:18px;margin:0;line-height:1.35}
.spot-thumb{width:100%;height:210px;object-fit:cover;border-radius:16px;margin:0 0 4px 0;border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 22px rgba(0,0,0,.16);display:block}
.ai-photo-note{font-size:10px;line-height:1.4;color:rgba(31,52,45,.72);margin:-1px 2px 6px;text-align:right}
.addr,.contact{font-size:12px;color:#1f342d;line-height:1.5;font-weight:700}
.contact{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px}
.phone-block{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.phone-contact-note{font-size:9.5px;line-height:1.35;color:rgba(31,52,45,.68);font-weight:700;margin:0 4px}
.search-note{font-size:10px;color:rgba(31,52,45,.66);margin-top:-2px}
.contact a{color:#0a5f4a;text-decoration:none;background:rgba(255,255,255,.32);padding:4px 7px;border-radius:9px}
.desc{font-size:13px;line-height:1.65;color:#223730;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.expanded{display:block;-webkit-line-clamp:unset}
.actions{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(64px,.65fr) 40px;gap:8px;margin-top:2px}
.btn{border:0;border-radius:12px;padding:8px 6px;font-weight:800;text-align:center;text-decoration:none;font-size:12px}
.btn.primary{background:rgba(11,122,92,.86);color:#fff}
.btn.secondary{background:rgba(255,255,255,.46);color:#284a40}
.btn.fav{font-size:19px;background:rgba(255,243,217,.58);color:#a46b00}
.empty{grid-column:1/-1;text-align:center;padding:45px;background:rgba(255,255,255,.62);border-radius:22px}
.note{margin-top:26px;padding:14px;border-radius:18px;background:rgba(255,248,232,.78);color:#735611;font-size:12px;line-height:1.7}
footer{max-width:1100px;margin:30px auto;padding:0 18px 40px;color:#fff;font-size:12px;line-height:1.8;text-shadow:0 2px 8px #0008}
footer a{color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#123b31;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:20;font-weight:800}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){
 .hero{min-height:310px}h1{margin-top:48px}.lead{font-size:15px}
 main{padding:0 12px}.grid{grid-template-columns:1fr;gap:22px}.search-wrap{display:grid}
 .card{width:92%}.locate{padding:12px}.actions{grid-template-columns:minmax(0,1.35fr) minmax(60px,.62fr) 40px}
}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
  <div class="brand"><div class="logo"><svg viewBox="0 0 64 64"><path d="M7 48 31 11l26 37H7Z" fill="#4ba37e"/><path d="m31 11 9 13-8 8-7-6-7 8Z" fill="#fff"/><circle cx="48" cy="13" r="7" fill="#f2be4f"/></svg></div><span>FUJINOMIYA TRAVEL GUIDE</span></div>
  <h1>ふじのみや旅ナビ</h1>
  <div class="lead">富士山のふもと、滝・湧水・神社・牧場・温泉へ。富士宮の魅力を、気分やジャンルからすぐ探せる観光スポット案内。</div>
</div></header>
<main>
  <section class="toolbar">
    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="スポット名・住所・見どころで検索">
      <button id="locationBtn" class="locate">📍 現在地を確認</button>
    </div>
    <div id="chips" class="chips"></div>
  </section>
  <div class="section-head"><h2>観光スポット</h2><div id="count" class="count"></div></div>
  <section id="grid" class="grid"></section>
  <div class="note">説明文はタップすると全文を開閉できます。住所や営業状況は出発前に公式情報でもご確認ください。</div>
</main>
<footer><strong>ふじのみや旅ナビ</strong><br>地図・経路ボタンは端末の地図サービスへ移動します。<br><a href="./admin.html">管理者画面</a></footer>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app-config.js"></script>
<script src="./spots-default.js"></script>
<script src="./data-store.js"></script>
<script>
const categoryMap=[
 ["すべて",()=>true],
 ["自然",s=>/自然|名勝|史跡・自然/.test(s.genre||"")],
 ["神社・仏閣",s=>/神社|仏閣/.test(s.genre||"")],
 ["体験・牧場",s=>/牧場|体験|キャンプ/.test(s.genre||"")],
 ["文化・史跡",s=>/文化|博物館|史跡/.test(s.genre||"")],
 ["温泉",s=>/温浴|温泉/.test(s.genre||"")],
 ["公園・レジャー",s=>/公園|レジャー/.test(s.genre||"")],
 ["道の駅・観光拠点",s=>/道の駅|観光拠点/.test(s.genre||"")]
];
let SPOTS=[],activeCategory="すべて";
let PHOTO_CARDS_ENABLED=true;
let favorites=new Set(JSON.parse(localStorage.getItem("fujinomiyaFavorites")||"[]"));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const mapUrl=s=>{
  if(Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lng))){
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${s.lat},${s.lng}`)}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${s.name} ${s.address}`)}`;
};
const routeUrl=s=>{
  const dest=(Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lng)))
    ? `${s.lat},${s.lng}`
    : `${s.name} ${s.address}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
};
const searchUrl=s=>`https://www.google.com/search?q=${encodeURIComponent(s.name)}`;

async function loadPhotoCardSetting(){
  // Supabase未設定時だけ、この端末内の設定を利用
  if(!SpotStore.cloudConfigured()){
    PHOTO_CARDS_ENABLED=localStorage.getItem("fujinomiya_photo_cards_enabled")!=="false";
    return;
  }

  try{
    const sb=SpotStore.getClient();
    const {data,error}=await sb
      .from("app_settings")
      .select("setting_value")
      .eq("setting_key","photos_enabled")
      .maybeSingle();

    if(error) throw error;

    // 設定行がまだない場合はONを既定値にする
    PHOTO_CARDS_ENABLED=data ? data.setting_value !== false : true;
  }catch(e){
    // 設定テーブル未作成などの場合も、サイト自体は壊さずONで表示
    PHOTO_CARDS_ENABLED=true;
  }
}

function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function renderChips(){
 const e=document.getElementById("chips");
 e.innerHTML=categoryMap.map(([l])=>`<button class="chip ${l===activeCategory?"active":""}" data-cat="${esc(l)}">${esc(l)}</button>`).join("");
 e.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderChips();render()});
}
function filtered(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const fn=categoryMap.find(([l])=>l===activeCategory)[1];
 return SPOTS.filter(fn).filter(s=>!q||`${s.name} ${s.genre} ${s.address} ${s.phone} ${s.homepage} ${displayDescription(s)}`.toLowerCase().includes(q));
}

const USER_DESCRIPTIONS={"白糸の滝":"国の名勝および天然記念物に指定されている世界文化遺産・富士山の構成資産。高さ20m、幅200mの湾曲した崖から、大小数百の滝が絹糸のように流れ落ちる姿は圧巻の美しさです。","音止の滝":"白糸の滝のすぐ近くにある迫力満点の滝。高さ約25mの崖から轟音を立てて水が流れ落ちます。かつて源頼朝が挙兵した際、曽我兄弟が密談の声を聞こうとしたところ、滝の音で聞こえなかったため神に祈ると音がピタリと止まったという伝説が残ります。","富士山本宮浅間大社":"全国に1300余りある浅間神社の総本宮。本殿は徳川家康が寄進した独特の「浅間造」で、国の重要文化財に指定されています。境内は広く、富士山の雪解け水が湧き出る「湧玉池」が美しく調和しています。","湧玉池":"富士山本宮浅間大社の境内にある特別天然記念物の湧水池。富士山の雪解け水が何層もの地層を何十年もかけて通り抜け、一日約20万トンもの清らかな水が湧き出ています。かつては富士山登拝者が身を清めた場所です。","静岡県富士山世界遺産センター":"富士山の世界文化遺産登録を記念して建てられた施設。美しい逆さ富士を模した逆cone型（木製格子造り）の建物が印象的です。らせんスロープを登りながら疑似登山体験ができ、富士山の歴史や自然、信仰について深く学べます。","田貫湖":"富士山西麓の朝霧高原の一角にある美しい湖。湖面に映る「逆さ富士」の絶景で知られ、特に4月20日前後と8月20日前後の年2回、ダイヤモンド富士（富士山の山頂から太陽が昇る現象）が見られることで有名です。","朝霧高原":"富士山の西側、標高700m〜1000mに広がる雄大な高原。遮るもののない大空と美しい富士山の絶景が広がり、酪農地帯としても有名。牧歌的な風景の中で、牧草地や牛の群れがのんびりと草を食む姿が楽しめます。","まかいの牧場":"朝霧高原にある体験型の観光牧場。羊やヤギなどの動物たちとのふれあいや、バター・アイスクリーム作りなどの体験教室が充実しています。富士山を背景にしたハンモックやブランコなど、フォトジェニックなスポットも人気です。","富士ミルクランド":"朝霧高原に位置する、動物と自然のふれあい牧場。入場無料で楽しめ、新鮮な牛乳を使ったジェラートやチーズなどの乳製品の味わいが人気です。動物のえさやり体験や宿泊施設（コテージ）も完備されています。","ふもとっぱら":"朝霧高原の広大な敷地にある、日本屈指の人気を誇るキャンプ場。視界を遮るものが一切ない開放的な空間から、真正面に雄大な富士山を望むことができます。広大な芝生のフリーサイトが特徴です。","陣馬の滝":"芝川の支流にある、穏やかで美しい滝。源頼朝が富士の巻狩りの際、この地で陣を張ったことからその名が付けられたと伝えられています。溶岩の間から湧き出る水が滝となっており、木々の緑と澄んだ水のコントラストが魅力的です。","奇石博物館":"世界中から集められた珍しい石や化石、鉱物を展示するユニークな博物館。硬い石をハンマーで割って宝石を探す「宝石探し体験」が大人気で、子どもから大人まで夢中になって楽しむことができます。","狩宿の下馬桜":"国の特別天然記念物に指定されているヤマザクラの古木（日本五大桜の一つ）。樹齢800年以上といわれ、源頼朝が富士の巻狩りの際に馬から降りたことから「下馬桜」の名があります。毎年5月上旬頃に淡いピンク色の花を咲かせます。","人穴富士講遺跡":"富士山の西麓にある、富士講の開祖・角行（かくぎょう）が修行したとされる溶岩洞穴および関連遺跡。国の史跡であり、世界文化遺産の構成資産の一つ。神秘的な雰囲気が漂い、江戸時代の富士山信仰の歴史を今に伝えています。","山宮浅間神社":"富士山の世界文化遺産構成資産の一つ。本殿を持たず、自然の山容（富士山そのもの）を直接拝むという古代からの祭祀形態（磐境：いわさか）を現在に残す、非常に神聖で歴史の古い神社です。","道の駅 朝霧高原":"朝霧高原の国道139号線沿いにある道の駅。目の前に雄大な富士山がそびえ立ち、展望台や休憩スペースからの眺望が抜群です。地元産の新鮮な野菜や乳製品、富士山麓のグルメが楽しめるレストランや売店が揃っています。","道の駅 富士宮":"富士宮市の市街地に位置し、観光拠点として便利な道の駅。富士宮やきそばをはじめとするご当地グルメのほか、朝採れの新鮮な地場野菜や特産品が豊富に並びます。情報発信コーナーも充実しています。","富嶽温泉 花の湯":"富士宮市にある、富士山の絶景を眺めながら多彩なお風呂を楽しめる大型温浴施設。炭酸泉や露天風呂、サウナのほか、宿泊施設も併設されており、旅の疲れを心ゆくまで癒やすことができます。","富士山天母の湯":"標高約650mの自然豊かな中腹に位置する市営の日帰り温泉施設。大浴場や露天風呂からは、富士宮市街や駿河湾、天気の良い日には遠く伊豆半島まで見渡すことができる絶景スポットです。","西山本門寺":"日蓮宗の名刹で、かつては多くの堂宇を誇った格式高い寺院。境内には樹齢数百年を超える巨樹が立ち並び、歴史と厳かな雰囲気を伝えています。国の重要文化財に指定された建造物も数多く残されています。","柚野の里（郷土資料等）":"富士宮市南西部の豊かな里山風景が広がる地域。棚田や古民家が残り、昔ながらの日本の原風景が色濃く残されています。地域の歴史や郷土資料に触れながら、のどかな散策が楽しめます。","猪之頭公園":"豊かな湧水群に恵まれた、自然あふれる公園。環境省の「名水百選」に選ばれた陣馬の滝周辺とも近く、清流のせせらぎやワサビ田など、富士山の伏流水が育んだ美しい自然環境を満喫できます。","もちだまき資料館":"日本の伝統食である「餅」や、地域に伝わる餅まき文化、郷土の歴史に関する資料を展示・紹介しているユニークな施設。地域の文化や昔の暮らしに触れることができます。","佐折の富士山ビューポイント":"富士宮市の佐折地区にある、知る人ぞ知る美しい富士山の撮影・鑑賞スポット。遮るもののない美しいアングルから、雄大な富士山の姿をじっくりとカメラや目に収めることができます。","県立朝霧野外活動センター":"朝霧高原の広大な敷地にある、自然体験や宿泊学習のための公立施設。キャンプ場や野外炊事場、研修施設が整っており、学校の宿泊行事やサークル活動、一般の自然愛好家まで幅広く利用されています。","富士山環境交流プラザ":"富士山の豊かな自然環境の保全と、環境学習・交流を目的とした施設。富士山の生態系や自然保護に関する展示が行われており、環境について楽しく学べるスポットです。","富士山神田川楽座":"富士宮市の中心を流れる神田川沿いにある、観光と市民の交流拠点。富士山の湧水を利用した親水公園が整備されており、散策の途中にひと休みしたり、地域のイベント情報などを得たりできます。","富士宮市民プール":"市民の健康増進やレジャーに利用される、充実した設備の市民プール。夏季を中心に多くの利用客でにぎわい、子どもから大人まで安全に水泳や水遊びを楽しむことができます。","外神東公園":"富士宮市内にある、地域住民の憩いの場となっている公園。広々とした敷地にはグラウンドや遊具が整備されており、子どもたちの遊び場やウォーキング、地域のイベントなどに利用されています。","芝川図書館・周辺文化施設":"旧芝川町の中心部に位置し、地域の読書や学習の拠点となっている図書館および周辺の文化施設。落ち着いた環境の中で本に親しむことができ、地域の文化活動の拠点となっています。","内房の筍・里山エリア":"竹林が広がり、春には特産の美味しい「内房のタケノコ」が収穫される美しい里山エリア。豊かな自然に囲まれ、四季折々の山の幸やのどかな景観を楽しむことができます。","稲子川温泉 ユー・トリオ":"稲子川のほとりにある、自然豊かな日帰り温泉施設。心地よいお湯とアットホームな雰囲気が特徴で、ハイキングやドライブの途中に立ち寄って、心身ともにリフレッシュできる癒やしスポットです。","光厳寺":"富士宮市内にある、歴史と静寂に包まれた古刹。境内や周辺には落ち着いた雰囲気が漂い、地域の歴史を今に伝える寺院として、静かな佇まいを見せています。","大カツラ（上井出の巨樹）":"上井出地区にある、圧倒的な存在感を放つ巨大なカツラの木。樹齢数百年以上ともいわれ、その生命力あふれる雄大な姿は地域の天然記念物としても親しまれ、自然の神秘を感じさせます。","富士眺望の湯 富士ぐりんぱ（近接・関連）":"富士山南東麓の裾野エリア（富士宮市周辺からもアクセスしやすいリゾート地）に位置する日帰り温泉施設。目の前に迫る富士山を眺めながら浸かる露天風呂が最高の贅沢として人気を集めています。"};
function displayDescription(s){return USER_DESCRIPTIONS[s.name]||s.description||"";}
function phoneContactName(phone){
 const digits=String(phone||"").replace(/\D/g,"");
 const contacts={
   "0544221489":"富士山世界遺産課企画係",
   "0544275240":"富士宮市観光協会",
   "0544221111":"富士宮市役所",
   "0544221155":"富士宮市役所観光課"
 };
 return contacts[digits]||"";
}

function render(){
 const data=filtered(); document.getElementById("count").textContent=`${data.length}件`;
 const g=document.getElementById("grid");
 if(!data.length){g.innerHTML='<div class="empty">条件に合うスポットがありません。</div>';return}
 g.innerHTML=data.map(s=>{
   const fav=favorites.has(s.id||s.name);
   const phoneContact=phoneContactName(s.phone);
   const phone=s.phone?`<div class="phone-block"><a href="tel:${esc(s.phone)}">☎ ${esc(s.phone)}</a>${phoneContact?`<div class="phone-contact-note">連絡先：${esc(phoneContact)}</div>`:""}</div>`:"";
   const hp=`<a href="${searchUrl(s)}" target="_blank" rel="noopener">🔎 検索する</a>`;
   const img=(PHOTO_CARDS_ENABLED && s.image_url)?`<div class="photo-wrap"><img class="spot-thumb" src="${esc(s.image_url)}" alt="${esc(s.name)}の写真" loading="lazy" onerror="this.closest('.photo-wrap').style.display='none'"><div class="ai-photo-note">※写真はAIで編集したイメージ画像です。</div></div>`:"";
   return `<article class="card"><div class="card-body">${img}
     <div class="badge">${esc(s.genre||"観光スポット")}</div>
     <h3>${esc(s.name)}</h3>
     <div class="addr">📍 ${esc(s.address)}</div>
     <div class="contact">${phone}${hp}</div><div class="search-note">「検索する」はスポット名でWeb検索します。</div>
     <div class="desc" data-expand>${esc(displayDescription(s))}</div>
     <div class="actions">
       <a class="btn primary" href="${routeUrl(s)}" target="_blank" rel="noopener">📍 現在地からの行き方</a>
       <a class="btn secondary" href="${mapUrl(s)}" target="_blank" rel="noopener">地図</a>
       <button class="btn fav" data-fav="${esc(s.id||s.name)}">${fav?"★":"☆"}</button>
     </div>
   </div></article>`;
 }).join("");
 g.querySelectorAll("[data-expand]").forEach(d=>d.onclick=()=>d.classList.toggle("expanded"));
 g.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const k=b.dataset.fav;favorites.has(k)?favorites.delete(k):favorites.add(k);localStorage.setItem("fujinomiyaFavorites",JSON.stringify([...favorites]));render()});
}
async function load(){
 await loadPhotoCardSetting();
 try{SPOTS=await SpotStore.list()}catch(e){toast("クラウド取得に失敗したため端末データを表示します");SPOTS=(window.DEFAULT_SPOTS||[])}
 renderChips();render();
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("locationBtn").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>toast(`現在地を確認しました（精度 約${Math.round(p.coords.accuracy)}m）`),()=>toast("位置情報の利用を許可してください"),{enableHighAccuracy:true,timeout:8000,maximumAge:30000}):toast("位置情報を利用できません");
load();
</script>
